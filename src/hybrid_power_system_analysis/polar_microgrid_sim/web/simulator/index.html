<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>极地微电网模拟台</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div class="brand">
          <span class="brand-mark"></span>
          <div>
            <h1>极地微电网模拟台</h1>
            <p id="runtimePath">runtime</p>
          </div>
        </div>
        <div class="clock-strip">
          <div class="clock-readout">
            <span id="simState">stopped</span>
            <strong id="simTime">00:00:00</strong>
            <small id="simSpeed">x1</small>
          </div>
          <button class="icon-button" data-clock="start" title="启动">
            <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z" /></svg>
          </button>
          <button class="icon-button" data-clock="pause" title="暂停">
            <svg viewBox="0 0 24 24"><path d="M7 5h4v14H7zM13 5h4v14h-4z" /></svg>
          </button>
          <button class="icon-button" data-clock="stop" title="停止">
            <svg viewBox="0 0 24 24"><path d="M6 6h12v12H6z" /></svg>
          </button>
          <button class="icon-button" data-clock="step" title="单步">
            <svg viewBox="0 0 24 24"><path d="M5 5v14l9-7-9-7zm11 0h3v14h-3z" /></svg>
          </button>
          <button class="icon-button" data-clock="slower" title="减速">
            <svg viewBox="0 0 24 24"><path d="M11 7 6 12l5 5V7zm7 0-5 5 5 5V7z" /></svg>
          </button>
          <button class="icon-button" data-clock="faster" title="加速">
            <svg viewBox="0 0 24 24"><path d="m6 7 5 5-5 5V7zm7 0 5 5-5 5V7z" /></svg>
          </button>
        </div>
      </header>

      <main class="workspace">
        <aside class="rail">
          <section class="panel compact">
            <h2>内核状态</h2>
            <dl class="metric-grid">
              <div><dt>量测</dt><dd id="metricScada">0</dd></div>
              <div><dt>命令</dt><dd id="metricCommands">0</dd></div>
              <div><dt>告警</dt><dd id="metricAlarms">0</dd></div>
              <div><dt>刷新</dt><dd id="metricRefresh">--</dd></div>
            </dl>
          </section>
          <section class="panel compact">
            <h2>典型日曲线</h2>
            <label>风速峰值 <input id="windPeak" type="range" min="0" max="50" value="38" /></label>
            <label>太阳峰值 <input id="solarPeak" type="range" min="0" max="1100" value="720" /></label>
            <label>气温均值 <input id="tempMean" type="range" min="-45" max="5" value="-18" /></label>
            <label>负荷基准 <input id="loadBase" type="range" min="40" max="400" value="180" /></label>
            <div class="button-row">
              <button id="pushCurves" class="primary">写入曲线</button>
              <button id="randomCurves">扰动</button>
            </div>
          </section>
          <section class="panel compact">
            <h2>学生命令</h2>
            <div id="commandInbox" class="log-list"></div>
          </section>
        </aside>

        <section class="center-stack">
          <section class="panel visual-panel">
            <div class="panel-head">
              <h2>天气与负荷</h2>
              <span id="curveStatus">未写入</span>
            </div>
            <div class="chart-grid">
              <canvas id="weatherChart" width="720" height="260"></canvas>
              <canvas id="loadChart" width="360" height="260"></canvas>
            </div>
          </section>

          <section class="panel visual-panel">
            <div class="panel-head">
              <h2>交直流混联系统</h2>
              <span id="solverInfo">solver</span>
            </div>
            <svg class="one-line" viewBox="0 0 900 260" role="img" aria-label="交直流微电网单线图">
              <defs>
                <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                  <path d="M0,0 L8,4 L0,8 z"></path>
                </marker>
              </defs>
              <path class="bus ac" d="M70 90H440"></path>
              <path class="bus dc" d="M520 90H830"></path>
              <path class="link" d="M440 90 C470 70,490 70,520 90" marker-end="url(#arrow)"></path>
              <g class="node online" transform="translate(95 90)"><circle r="18"></circle><text y="46">柴发</text></g>
              <g class="node online" transform="translate(225 90)"><circle r="18"></circle><text y="46">负荷</text></g>
              <g class="node online" transform="translate(355 90)"><circle r="18"></circle><text y="46">AC母线</text></g>
              <g class="node online" transform="translate(580 90)"><rect x="-20" y="-20" width="40" height="40"></rect><text y="50">DCAC</text></g>
              <g class="node online" transform="translate(700 90)"><rect x="-20" y="-20" width="40" height="40"></rect><text y="50">储能</text></g>
              <g class="node warn" transform="translate(800 90)"><rect x="-20" y="-20" width="40" height="40"></rect><text y="50">风光</text></g>
              <path class="drop" d="M225 108V190H355"></path>
              <path class="drop" d="M700 110V190H800"></path>
              <text class="caption" x="70" y="40">AC侧</text>
              <text class="caption" x="520" y="40">DC侧</text>
            </svg>
            <div id="deviceTable" class="data-table"></div>
          </section>
        </section>

        <aside class="settings">
          <section class="panel">
            <div class="panel-head">
              <h2>设备故障</h2>
              <button id="addDeviceFault">添加</button>
            </div>
            <div class="form-grid">
              <input id="faultDevType" placeholder="dev_type" value="ACBreak" />
              <input id="faultDevName" placeholder="dev_name" value="sw_diesel_ac" />
              <input id="faultStart" type="number" min="0" max="1439" value="60" />
              <input id="faultClear" type="number" min="0" max="1439" value="120" />
            </div>
            <div id="deviceFaults" class="fault-list"></div>
          </section>

          <section class="panel">
            <div class="panel-head">
              <h2>量测故障</h2>
              <button id="addMeasFault">添加</button>
            </div>
            <div class="form-grid">
              <input id="measTarget" placeholder="量测名" value="p_load" />
              <select id="measFaultType">
                <option value="dead">死数</option>
                <option value="zero">0值</option>
                <option value="bias">大偏差</option>
              </select>
              <input id="measStart" type="number" min="0" max="1439" value="180" />
              <input id="measClear" type="number" min="0" max="1439" value="240" />
            </div>
            <div id="measFaults" class="fault-list"></div>
          </section>

          <section class="panel">
            <div class="panel-head">
              <h2>运行模式</h2>
              <button id="pushModes">下发</button>
            </div>
            <div id="modeTable" class="mode-table"></div>
          </section>
        </aside>
      </main>
    </div>
    <script src="./app.js"></script>
  </body>
</html>
