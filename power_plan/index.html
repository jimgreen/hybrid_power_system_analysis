<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>南极秦岭站综合能量管理系统</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      overflow: hidden;
      color: #eef7ff;
      font-family: "Microsoft YaHei", "PingFang SC", Arial, sans-serif;
      background: #030b18;
    }

    a { color: inherit; text-decoration: none; }

    .screen {
      position: relative;
      width: 100vw;
      height: 100vh;
      min-height: 720px;
      background-image: url("assets/main-dashboard-bg.png");
      background-position: center;
      background-size: cover;
      background-repeat: no-repeat;
      isolation: isolate;
    }

    .screen::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background:
        linear-gradient(90deg, rgba(2, 10, 22, 0.32), transparent 18%, transparent 82%, rgba(2, 10, 22, 0.22)),
        radial-gradient(circle at 50% 52%, transparent 0 48%, rgba(2, 10, 22, 0.18) 78%);
      z-index: 1;
    }

    .hot-nav {
      position: absolute;
      left: clamp(18px, 2.3vw, 40px);
      top: clamp(190px, 26vh, 260px);
      width: clamp(190px, 14vw, 260px);
      display: grid;
      gap: clamp(10px, 1.5vh, 16px);
      z-index: 3;
    }

    .hot-nav a {
      height: clamp(52px, 7.3vh, 70px);
      display: flex;
      align-items: center;
      padding-left: clamp(76px, 5.4vw, 102px);
      border: 1px solid rgba(21, 211, 255, 0.58);
      border-radius: 6px;
      background: linear-gradient(90deg, rgba(5, 34, 70, 0.74), rgba(4, 19, 42, 0.44));
      color: #eff8ff;
      font-size: clamp(17px, 1.35vw, 25px);
      font-weight: 800;
      letter-spacing: 0;
      box-shadow:
        inset 0 0 18px rgba(24, 175, 255, 0.36),
        0 0 18px rgba(0, 173, 255, 0.18);
      text-shadow: 0 0 10px rgba(44, 183, 255, 0.74);
    }

    .hot-nav a:hover,
    .hot-nav a:focus-visible {
      outline: none;
      border-color: rgba(44, 230, 255, 0.92);
      background: linear-gradient(90deg, rgba(7, 74, 130, 0.84), rgba(5, 32, 74, 0.62));
      box-shadow:
        inset 0 0 22px rgba(24, 175, 255, 0.56),
        0 0 30px rgba(0, 173, 255, 0.42);
      transform: translateX(3px);
    }

    .quick-links {
      position: absolute;
      right: clamp(30px, 4vw, 70px);
      bottom: clamp(30px, 4.5vh, 58px);
      display: flex;
      gap: 12px;
      z-index: 3;
    }

    .quick-links a {
      min-width: 136px;
      padding: 12px 16px;
      border: 1px solid rgba(21, 211, 255, 0.52);
      border-radius: 6px;
      background: rgba(3, 18, 39, 0.72);
      color: #bfeeff;
      font-size: 14px;
      font-weight: 700;
      text-align: center;
      box-shadow: inset 0 0 16px rgba(24, 175, 255, 0.24);
    }

    .quick-links a:hover,
    .quick-links a:focus-visible {
      outline: none;
      color: #ffffff;
      border-color: rgba(74, 255, 204, 0.82);
      box-shadow: inset 0 0 18px rgba(74, 255, 204, 0.24), 0 0 22px rgba(0, 173, 255, 0.28);
    }

    @media (max-width: 980px) {
      body { overflow: auto; }

      .screen {
        min-height: 760px;
        background-size: auto 100%;
      }

      .hot-nav {
        top: 190px;
        width: 220px;
      }

      .quick-links {
        left: 18px;
        right: 18px;
        bottom: 22px;
        display: grid;
        grid-template-columns: repeat(3, 1fr);
      }

      .quick-links a { min-width: 0; }
    }

    @media (max-width: 640px) {
      .screen {
        min-height: 820px;
        background-position: center top;
      }

      .hot-nav {
        top: 210px;
        width: 180px;
      }

      .hot-nav a {
        height: 52px;
        padding-left: 66px;
        font-size: 16px;
      }

      .quick-links {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <main class="screen" aria-label="南极秦岭站综合能量管理系统首页">
    <nav class="hot-nav" aria-label="系统主导航">
      <a href="index.html">系统首页</a>
      <a href="simu.html">SIMU监视</a>
      <a href="scada.html">SCADA监视</a>
      <a href="agc.html">AGC监视</a>
      <a href="planning.html">参数维护</a>
      <a href="planning.html">电网规划</a>
    </nav>

    <nav class="quick-links" aria-label="在线监视快捷入口">
      <a href="simu.html">SIMU在线监视</a>
      <a href="scada.html">SCADA在线监视</a>
      <a href="agc.html">AGC在线监视</a>
    </nav>
  </main>
</body>
</html>
