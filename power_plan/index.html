<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>考察站风-光-氢-储-柴联合规划系统</title>
  <link rel="icon" href="data:,">
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      overflow: hidden;
      color: #eef7ff;
      font-family: "Microsoft YaHei", "PingFang SC", Arial, sans-serif;
      background: #030b18;
    }

    a { color: inherit; text-decoration: none; }

    .screen {
      position: relative;
      width: 100vw;
      height: 100vh;
      min-height: 720px;
      overflow: hidden;
      isolation: isolate;
    }

    .screen::before {
      content: "";
      position: absolute;
      inset: 0;
      background-image: url("assets/main-dashboard-bg.png?v=20260510-title-safe");
      background-position: center;
      background-size: contain;
      background-repeat: no-repeat;
      filter: saturate(1.08) brightness(0.74) contrast(1.08);
      opacity: 1;
      z-index: 0;
    }

    .screen::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background:
        linear-gradient(180deg, rgba(0, 16, 45, 0.18), rgba(0, 10, 30, 0.46) 58%, rgba(0, 7, 20, 0.72)),
        radial-gradient(circle at 50% 43%, rgba(13, 116, 204, 0.36), transparent 44%),
        linear-gradient(90deg, rgba(2, 10, 22, 0.76), transparent 18%, transparent 82%, rgba(2, 10, 22, 0.76));
      z-index: 1;
    }

    .home-user-status {
      position: absolute;
      top: 24px;
      right: 32px;
      z-index: 5;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      border: 1px solid rgba(20, 190, 255, 0.58);
      border-radius: 8px;
      background: linear-gradient(180deg, rgba(3, 35, 84, 0.82), rgba(1, 14, 42, 0.9));
      color: #bdeaff;
      box-shadow: inset 0 0 18px rgba(24, 175, 255, 0.22), 0 0 24px rgba(0, 166, 255, 0.24);
      font-size: 15px;
      font-weight: 800;
    }

    .home-user-status[hidden],
    [data-admin-only][hidden] {
      display: none;
    }

    .home-user-status strong {
      color: #21d5ff;
    }

    .home-user-status a,
    .home-user-status button {
      padding: 6px 9px;
      border: 1px solid rgba(21, 211, 255, 0.48);
      border-radius: 8px;
      background: rgba(5, 34, 70, 0.7);
      color: #eff8ff;
      font: inherit;
      cursor: pointer;
    }

    .feature-entry-grid {
      position: absolute;
      left: 50%;
      top: 50%;
      width: min(1140px, calc(100vw - 260px));
      min-height: clamp(320px, 41vh, 400px);
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: clamp(24px, 2.2vw, 40px);
      padding: clamp(40px, 4.2vh, 58px) clamp(42px, 3.8vw, 68px);
      transform: translate(-50%, -29%);
      isolation: isolate;
      z-index: 3;
    }

    .feature-entry-grid::before,
    .feature-entry-grid::after {
      content: "";
      position: absolute;
      pointer-events: none;
      z-index: -1;
    }

    .feature-entry-grid::before {
      inset: 0;
      border: 1px solid rgba(20, 190, 255, 0.64);
      border-radius: 10px;
      background:
        linear-gradient(90deg, transparent 0 5%, rgba(25, 202, 255, 0.52) 5% 7%, transparent 7% 93%, rgba(25, 202, 255, 0.52) 93% 95%, transparent 95%),
        linear-gradient(180deg, rgba(0, 90, 180, 0.2), rgba(0, 26, 68, 0.64));
      box-shadow:
        inset 0 0 42px rgba(23, 170, 255, 0.23),
        inset 0 0 90px rgba(0, 56, 130, 0.3),
        0 0 42px rgba(0, 166, 255, 0.4),
        0 24px 80px rgba(0, 6, 20, 0.46);
      clip-path: polygon(4% 0, 96% 0, 100% 16%, 100% 84%, 96% 100%, 4% 100%, 0 84%, 0 16%);
    }

    .feature-entry-grid::after {
      left: 8%;
      right: 8%;
      bottom: 24px;
      height: 2px;
      background:
        linear-gradient(90deg, transparent, rgba(35, 211, 255, 0.9), transparent),
        repeating-linear-gradient(90deg, transparent 0 18px, rgba(35, 211, 255, 0.62) 18px 24px);
      box-shadow: 0 0 16px rgba(35, 211, 255, 0.82);
    }

    .feature-entry {
      position: relative;
      min-height: clamp(248px, 32vh, 318px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: clamp(20px, 2.4vh, 30px);
      padding: clamp(24px, 2.2vw, 34px);
      border: 1px solid rgba(39, 202, 255, 0.82);
      border-radius: 10px;
      background:
        radial-gradient(circle at 50% 28%, rgba(36, 210, 255, 0.16), transparent 36%),
        linear-gradient(180deg, rgba(3, 35, 84, 0.78), rgba(1, 14, 42, 0.92));
      box-shadow:
        inset 0 0 0 1px rgba(69, 223, 255, 0.22),
        inset 0 0 44px rgba(0, 143, 255, 0.24),
        0 0 30px rgba(0, 166, 255, 0.32),
        0 20px 54px rgba(0, 8, 28, 0.38);
      backdrop-filter: blur(3px);
      transition: transform 0.18s ease, border-color 0.18s ease, background 0.18s ease, box-shadow 0.18s ease;
    }

    .feature-entry::before,
    .feature-entry::after {
      content: "";
      position: absolute;
      pointer-events: none;
    }

    .feature-entry::before {
      inset: 12px;
      border: 1px solid rgba(39, 202, 255, 0.54);
      border-radius: 7px;
      box-shadow:
        inset 0 0 22px rgba(39, 202, 255, 0.22),
        0 0 12px rgba(39, 202, 255, 0.18);
      clip-path: polygon(7% 0, 93% 0, 100% 12%, 100% 88%, 93% 100%, 7% 100%, 0 88%, 0 12%);
    }

    .feature-entry::after {
      left: 13%;
      right: 13%;
      bottom: 58px;
      height: 2px;
      background:
        linear-gradient(90deg, transparent, rgba(47, 221, 255, 0.96), transparent),
        repeating-linear-gradient(90deg, transparent 0 28px, rgba(47, 221, 255, 0.58) 28px 36px);
      box-shadow: 0 0 12px rgba(47, 221, 255, 0.9);
    }

    .feature-entry:hover,
    .feature-entry:focus-visible {
      outline: none;
      transform: translateY(-8px);
      border-color: rgba(108, 238, 255, 0.98);
      background:
        radial-gradient(circle at 50% 28%, rgba(44, 225, 255, 0.24), transparent 38%),
        linear-gradient(180deg, rgba(3, 50, 112, 0.84), rgba(2, 21, 58, 0.94));
      box-shadow:
        inset 0 0 0 1px rgba(124, 241, 255, 0.26),
        inset 0 0 44px rgba(0, 178, 255, 0.24),
        0 0 42px rgba(0, 190, 255, 0.48),
        0 24px 54px rgba(0, 13, 40, 0.5);
    }

    .feature-icon {
      position: relative;
      width: clamp(132px, 10vw, 176px);
      height: clamp(132px, 10vw, 176px);
      display: grid;
      place-items: center;
      color: #21d5ff;
      filter:
        drop-shadow(0 0 12px rgba(25, 205, 255, 0.92))
        drop-shadow(0 0 26px rgba(0, 150, 255, 0.48));
      z-index: 1;
    }

    .feature-icon svg {
      width: 100%;
      height: 100%;
      stroke: currentColor;
      stroke-width: 2.7;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: rgba(25, 205, 255, 0.12);
    }

    .feature-entry strong {
      color: #eff8ff;
      font-size: clamp(31px, 2.35vw, 43px);
      font-weight: 900;
      letter-spacing: 0.03em;
      text-shadow: 0 0 18px rgba(44, 183, 255, 0.95), 0 3px 3px rgba(0, 8, 20, 0.86);
      z-index: 1;
    }

    .energy-side {
      position: absolute;
      top: 50%;
      min-height: clamp(320px, 41vh, 400px);
      display: grid;
      align-content: space-around;
      gap: 0;
      color: #27d6ff;
      transform: translateY(-29%);
      z-index: 3;
    }

    .energy-left {
      left: max(48px, calc(50% - 760px));
    }

    .energy-right {
      right: max(48px, calc(50% - 760px));
    }

    .energy-side span {
      position: relative;
      width: clamp(64px, 5.8vw, 96px);
      height: clamp(64px, 5.8vw, 96px);
      display: grid;
      place-items: center;
      opacity: 0.9;
      filter: drop-shadow(0 0 10px rgba(25, 205, 255, 0.78));
    }

    .energy-side svg {
      width: 100%;
      height: 100%;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: rgba(25, 205, 255, 0.1);
    }

    .energy-side span::after {
      content: "";
      position: absolute;
      top: 50%;
      width: clamp(62px, 7vw, 112px);
      height: 2px;
      background: linear-gradient(90deg, transparent, rgba(39, 214, 255, 0.94));
      box-shadow: 0 0 10px rgba(39, 214, 255, 0.9);
    }

    .energy-left span::after {
      left: 100%;
    }

    .energy-right span::after {
      right: 100%;
      transform: rotate(180deg);
    }

    .energy-side span::before {
      content: "";
      position: absolute;
      top: calc(50% - 4px);
      width: 8px;
      height: 8px;
      border: 2px solid currentColor;
      border-radius: 50%;
      background: #04182f;
      box-shadow: 0 0 12px rgba(39, 214, 255, 0.9);
    }

    .energy-left span::before {
      left: calc(100% + clamp(58px, 6.5vw, 104px));
    }

    .energy-right span::before {
      right: calc(100% + clamp(58px, 6.5vw, 104px));
    }

    @media (max-width: 980px) {
      body { overflow: auto; }

      .screen {
        min-height: 760px;
      }

      .feature-entry-grid {
        left: 24px;
        right: 24px;
        top: 50%;
        width: auto;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        transform: translateY(-30%);
      }

      .feature-entry {
        min-height: 170px;
        padding: 16px;
      }

      .energy-side {
        display: none;
      }
    }

    @media (max-width: 640px) {
      .screen {
        min-height: 820px;
      }

      .screen::before {
        background-position: center top;
      }

      .feature-entry-grid {
        left: 18px;
        right: 18px;
        top: 310px;
        width: auto;
        grid-template-columns: 1fr;
        transform: none;
      }

      .feature-entry {
        min-height: 112px;
        display: grid;
        grid-template-columns: 74px minmax(0, 1fr);
        grid-template-rows: auto;
        align-items: center;
        gap: 14px;
      }

      .feature-icon {
        width: 78px;
        height: 78px;
        grid-row: 1 / 3;
      }

      .feature-entry strong {
        font-size: 25px;
      }
    }
  </style>
</head>
