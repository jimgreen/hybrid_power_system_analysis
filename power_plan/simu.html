<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SIMU在线监视</title>
  <style>
    :root {
      --bg: #07111f;
      --panel: rgba(13, 28, 48, 0.88);
      --line: rgba(132, 178, 224, 0.22);
      --text: #e8f2ff;
      --muted: #8fa6bf;
      --cyan: #36d7ff;
      --green: #41e39b;
      --yellow: #ffd166;
      --red: #ff6b6b;
      --blue: #4f8cff;
      --shadow: 0 20px 70px rgba(0, 0, 0, 0.34);
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--text);
      font-family: "Microsoft YaHei", "PingFang SC", Arial, sans-serif;
      background:
        radial-gradient(circle at 18% 14%, rgba(54, 215, 255, 0.18), transparent 26%),
        radial-gradient(circle at 86% 16%, rgba(65, 227, 155, 0.12), transparent 24%),
        linear-gradient(135deg, #06101c 0%, #0a1424 52%, #061321 100%);
    }

    a { color: inherit; text-decoration: none; }
    .shell { display: grid; grid-template-columns: 232px minmax(0, 1fr); min-height: 100vh; }
    .sidebar { padding: 24px 18px; border-right: 1px solid var(--line); background: rgba(5, 13, 24, 0.76); backdrop-filter: blur(18px); }
    .brand { display: flex; align-items: center; gap: 12px; margin-bottom: 28px; }
    .brand-mark { width: 42px; height: 42px; display: grid; place-items: center; border: 1px solid rgba(54, 215, 255, 0.52); border-radius: 8px; background: linear-gradient(145deg, rgba(54, 215, 255, 0.2), rgba(65, 227, 155, 0.1)); color: var(--cyan); font-weight: 800; }
    .brand strong { display: block; font-size: 15px; }
    .brand span { display: block; margin-top: 3px; color: var(--muted); font-size: 12px; }
    .nav { display: grid; gap: 10px; }
    .nav a { padding: 12px 13px; border: 1px solid transparent; border-radius: 8px; color: #b9cbe0; font-size: 14px; }
    .nav a.active, .nav a:hover { border-color: rgba(54, 215, 255, 0.3); background: rgba(54, 215, 255, 0.1); color: var(--text); }
    .side-status { margin-top: 32px; padding: 16px; border: 1px solid var(--line); border-radius: 8px; background: rgba(16, 36, 60, 0.56); }
    .side-status small { color: var(--muted); }
    .side-status strong { display: block; margin-top: 8px; color: var(--green); font-size: 24px; }

    main { padding: 22px; }
    .topbar { display: flex; align-items: center; justify-content: space-between; gap: 18px; margin-bottom: 16px; }
    h1 { margin: 0; font-size: 28px; font-weight: 800; }
    .subhead { margin: 6px 0 0; color: var(--muted); font-size: 13px; }
    .clock { min-width: 232px; padding: 12px 16px; border: 1px solid var(--line); border-radius: 8px; background: rgba(13, 28, 48, 0.7); text-align: right; box-shadow: var(--shadow); }
    .clock span { display: block; color: var(--muted); font-size: 12px; }
    .clock strong { display: block; margin-top: 4px; font-size: 18px; }

    .telemetry-strip {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 14px;
      margin-bottom: 16px;
    }

    .status-card,
    .control-bar,
    .curve-card {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      box-shadow: var(--shadow);
    }

    .status-card { padding: 14px 16px; }
    .status-card span { display: block; color: var(--muted); font-size: 12px; }
    .status-card strong { display: block; margin-top: 7px; color: var(--cyan); font-size: 22px; }
    .status-card strong.running { color: var(--green); }
    .status-card strong.stopped { color: var(--yellow); }
    .sidebar-status-grid { margin-top: 18px; display: grid; gap: 10px; }
    .sidebar-status-grid .status-card { padding: 12px; }
    .sidebar-status-grid .status-card strong { font-size: 18px; }

    .simu-layout { display: grid; grid-template-columns: minmax(0, 1fr) 260px; gap: 16px; }
    .curves { display: grid; gap: 14px; }

    .curve-card { min-height: 150px; overflow: hidden; }
    .curve-head { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; border-bottom: 1px solid var(--line); }
    .curve-head h2 { margin: 0; font-size: 16px; }
    .curve-head span { color: var(--muted); font-size: 12px; }
    .curve-body { height: 116px; padding: 8px 12px 12px; }
    .curve-svg { width: 100%; height: 100%; display: block; }
    .axis { stroke: rgba(132, 178, 224, 0.18); stroke-width: 1; }
    .curve-line { fill: none; stroke: var(--cyan); stroke-width: 3; filter: drop-shadow(0 0 7px rgba(54, 215, 255, 0.45)); }
    .curve-area { fill: rgba(54, 215, 255, 0.08); }
    .cursor-line { stroke: var(--yellow); stroke-width: 2; stroke-dasharray: 5 5; }
    .cursor-dot { fill: var(--yellow); stroke: #061321; stroke-width: 2; }
    .cursor-label { fill: var(--yellow); font-size: 12px; font-weight: 700; }
    .tick-label { fill: var(--muted); font-size: 11px; }

    .control-panel { display: grid; gap: 16px; align-content: start; }
    .control-bar { padding: 16px; }
    .control-bar h2 { margin: 0 0 14px; font-size: 16px; }
    .buttons { display: grid; gap: 10px; }
    .buttons button {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid rgba(54, 215, 255, 0.36);
      border-radius: 8px;
      background: rgba(54, 215, 255, 0.1);
      color: var(--text);
      font: inherit;
      font-weight: 800;
      cursor: pointer;
      box-shadow: inset 0 0 18px rgba(54, 215, 255, 0.14);
    }
    .buttons button:hover { border-color: rgba(65, 227, 155, 0.7); color: #ffffff; }
    .buttons button.stop { border-color: rgba(255, 107, 107, 0.42); color: #ffd6d6; }
    .buttons button.reset { border-color: rgba(255, 209, 102, 0.42); color: #fff0c0; }

    .event-list { padding: 14px 16px; display: grid; gap: 12px; color: #dceaff; font-size: 13px; }
    .event-row { display: grid; grid-template-columns: 58px minmax(0, 1fr); gap: 10px; border-bottom: 1px solid var(--line); padding-bottom: 10px; }
    .event-row:last-child { border-bottom: 0; padding-bottom: 0; }
    .event-row span { color: var(--muted); }
    .tag { display: inline-flex; width: max-content; margin-top: 6px; padding: 3px 8px; border-radius: 999px; border: 1px solid rgba(65, 227, 155, 0.38); color: var(--green); font-size: 12px; }
    .tag.warn { border-color: rgba(255, 209, 102, 0.48); color: var(--yellow); }

    @media (max-width: 1080px) {
      .simu-layout { grid-template-columns: 1fr; }
      .telemetry-strip { grid-template-columns: repeat(2, 1fr); }
    }

    @media (max-width: 760px) {
      .shell { grid-template-columns: 1fr; }
      .nav { grid-template-columns: 1fr; }
      .topbar { flex-direction: column; align-items: flex-start; }
      .clock { width: 100%; text-align: left; }
      .telemetry-strip { grid-template-columns: 1fr; }
      main { padding: 16px; }
    }

    body {
      background: #030b18 url("assets/clean-dashboard-bg.png") center / cover fixed no-repeat;
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        linear-gradient(90deg, rgba(2, 10, 22, 0.88), rgba(2, 10, 22, 0.44) 28%, rgba(2, 10, 22, 0.56)),
        radial-gradient(circle at 50% 42%, rgba(0, 173, 255, 0.12), transparent 42%);
      z-index: -1;
    }
    .sidebar,
    .status-card,
    .control-bar,
    .curve-card,
    .clock {
      border-color: rgba(21, 211, 255, 0.52);
      background: linear-gradient(135deg, rgba(3, 18, 39, 0.84), rgba(5, 34, 70, 0.58));
      box-shadow: inset 0 0 18px rgba(24, 175, 255, 0.22), 0 0 26px rgba(0, 173, 255, 0.16);
    }
    .topbar {
      padding: 12px 18px;
      border: 1px solid rgba(21, 211, 255, 0.42);
      border-radius: 8px;
      background: rgba(3, 18, 39, 0.56);
      box-shadow: inset 0 0 18px rgba(24, 175, 255, 0.18);
    }
    h1,
    .curve-head h2,
    .control-bar h2 {
      text-shadow: 0 0 12px rgba(44, 183, 255, 0.74);
    }
    .nav a,
    .buttons button {
      border-color: rgba(21, 211, 255, 0.52);
      background: linear-gradient(90deg, rgba(5, 34, 70, 0.74), rgba(4, 19, 42, 0.44));
      box-shadow: inset 0 0 16px rgba(24, 175, 255, 0.24);
      text-shadow: 0 0 10px rgba(44, 183, 255, 0.5);
    }
    .nav a.active,
    .nav a:hover,
    .buttons button:hover {
      border-color: rgba(44, 230, 255, 0.92);
      background: linear-gradient(90deg, rgba(7, 74, 130, 0.84), rgba(5, 32, 74, 0.62));
      box-shadow: inset 0 0 22px rgba(24, 175, 255, 0.56), 0 0 30px rgba(0, 173, 255, 0.32);
    }
    .curve-head,
    .event-row {
      border-color: rgba(21, 211, 255, 0.28);
    }
    .telemetry-strip .status-card strong {
      font-size: 24px;
    }
  </style>
</head>
<body>
  <div class="shell">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark">P</div>
        <div><strong>电力监视中心</strong><span>Hybrid Power Console</span></div>
      </div>
      <nav class="nav">
        <a href="index.html">系统首页</a>
        <a class="active" href="simu.html">SIMU在线监视</a>
        <a href="scada.html">SCADA在线监视</a>
        <a href="agc.html">AGC在线监视</a>
      </nav>
      <div class="side-status">
        <small>仿真引擎状态</small>
        <strong id="side-status">STOPPED</strong>
      </div>
      <div class="sidebar-status-grid" aria-label="系统状态标签栏">
        <article class="status-card"><span>当前仿真时间</span><strong id="sim-time">00:00</strong></article>
        <article class="status-card"><span>仿真速度</span><strong id="sim-speed">1.0x</strong></article>
        <article class="status-card"><span>仿真运行状态</span><strong id="sim-status" class="stopped">STOPPED</strong></article>
        <article class="status-card"><span>游标定位</span><strong id="cursor-hour">0.00 h</strong></article>
      </div>
    </aside>

    <main>
      <header class="topbar">
        <div>
          <h1>SIMU在线监视</h1>
          <p class="subhead">风速、温度、太阳辐射、负荷日曲线与仿真时刻游标</p>
        </div>
        <div class="clock"><span>系统时间</span><strong id="clock">--</strong></div>
      </header>

      <section class="telemetry-strip" aria-label="实时数据标签栏">
        <article class="status-card"><span>风速</span><strong id="live-wind">--</strong></article>
        <article class="status-card"><span>温度</span><strong id="live-temp">--</strong></article>
        <article class="status-card"><span>太阳辐射</span><strong id="live-solar">--</strong></article>
        <article class="status-card"><span>负荷</span><strong id="live-load">--</strong></article>
      </section>

      <section class="simu-layout">
        <div class="curves" id="curve-stack"></div>

        <aside class="control-panel">
          <section class="control-bar">
            <h2>控制栏</h2>
            <div class="buttons">
              <button data-action="start">启动</button>
              <button data-action="faster">加速</button>
              <button data-action="slower">减速</button>
              <button class="stop" data-action="stop">停止</button>
              <button class="reset" data-action="reset">归零</button>
            </div>
          </section>

          <section class="control-bar">
            <h2>状态事件</h2>
            <div class="event-list" id="simu-alarms"></div>
          </section>
        </aside>
      </section>
    </main>
  </div>

  <script>
    const clock = document.getElementById("clock");
    const colors = {
      "风速": "#36d7ff",
      "温度": "#ffd166",
      "太阳辐射": "#41e39b",
      "负荷": "#4f8cff"
    };

    function updateClock() {
      clock.textContent = new Date().toLocaleString("zh-CN", { hour12: false });
    }

    function pointValueAt(points, cursorHour) {
      if (!points || points.length === 0) return "--";
      let best = points[0];
      for (const point of points) {
        if (Math.abs(Number(point.hour) - cursorHour) < Math.abs(Number(best.hour) - cursorHour)) best = point;
      }
      return best.value;
    }

    function renderCurve(curve, state) {
      const width = 900;
      const height = 100;
      const padX = 36;
      const padY = 18;
      const points = curve.points || [];
      const values = points.map((p) => Number(p.value));
      const min = Math.min(...values);
      const max = Math.max(...values);
      const span = max - min || 1;
      const xOf = (hour) => padX + (Number(hour) / 23) * (width - padX * 2);
      const yOf = (value) => height - padY - ((Number(value) - min) / span) * (height - padY * 2);
      const path = points.map((p, index) => (index ? "L" : "M") + xOf(p.hour).toFixed(1) + " " + yOf(p.value).toFixed(1)).join(" ");
      const area = path + " L " + xOf(23).toFixed(1) + " " + (height - padY) + " L " + xOf(0).toFixed(1) + " " + (height - padY) + " Z";
      const cursorX = padX + ((state.cursor_hour || 0) / 24) * (width - padX * 2);
      const currentValue = pointValueAt(points, Number(state.cursor_hour || 0));
      const currentY = yOf(currentValue);
      const color = colors[curve.name] || "#36d7ff";

      return '<article class="curve-card">' +
        '<div class="curve-head"><h2>' + curve.name + '</h2><span>当前 ' + currentValue + ' ' + curve.unit + '</span></div>' +
        '<div class="curve-body"><svg class="curve-svg" viewBox="0 0 ' + width + ' ' + height + '" preserveAspectRatio="none">' +
        '<line class="axis" x1="' + padX + '" y1="' + (height - padY) + '" x2="' + (width - padX) + '" y2="' + (height - padY) + '"></line>' +
        '<line class="axis" x1="' + padX + '" y1="' + padY + '" x2="' + padX + '" y2="' + (height - padY) + '"></line>' +
        '<text class="tick-label" x="' + padX + '" y="96">0h</text><text class="tick-label" x="' + (width / 2 - 12) + '" y="96">12h</text><text class="tick-label" x="' + (width - padX - 24) + '" y="96">24h</text>' +
        '<path class="curve-area" d="' + area + '" style="fill:' + color + '18"></path>' +
        '<path class="curve-line" d="' + path + '" style="stroke:' + color + '"></path>' +
        '<line class="cursor-line" x1="' + cursorX + '" y1="' + padY + '" x2="' + cursorX + '" y2="' + (height - padY) + '"></line>' +
        '<circle class="cursor-dot" cx="' + cursorX + '" cy="' + currentY + '" r="5"></circle>' +
        '<text class="cursor-label" x="' + Math.min(cursorX + 8, width - 72) + '" y="' + Math.max(currentY - 8, 14) + '">' + state.sim_time + '</text>' +
        '</svg></div></article>';
    }

    function renderState(state) {
      document.getElementById("sim-time").textContent = state.sim_time || "00:00";
      document.getElementById("sim-speed").textContent = Number(state.speed || 1).toFixed(2) + "x";
      document.getElementById("cursor-hour").textContent = Number(state.cursor_hour || 0).toFixed(2) + " h";
      const status = document.getElementById("sim-status");
      status.textContent = state.status || "STOPPED";
      status.className = state.status === "RUNNING" ? "running" : "stopped";
      document.getElementById("side-status").textContent = status.textContent;
    }

    function renderTelemetry(curves, state) {
      const targets = {
        "风速": "live-wind",
        "温度": "live-temp",
        "太阳辐射": "live-solar",
        "负荷": "live-load"
      };
      for (const curve of curves || []) {
        const target = targets[curve.name];
        if (!target) continue;
        const value = pointValueAt(curve.points, Number(state.cursor_hour || 0));
        document.getElementById(target).textContent = value + " " + curve.unit;
      }
    }

    function renderAlarms(items) {
      document.getElementById("simu-alarms").innerHTML = (items || []).map((item) => {
        const warn = item.status === "关注" ? " warn" : "";
        return '<div class="event-row"><span>' + item.time + '</span><div><strong>' + item.object + '</strong><br>' + item.message + '<br><span class="tag' + warn + '">' + item.status + '</span></div></div>';
      }).join("");
    }

    async function loadBackendData() {
      const response = await fetch("/api/simu", { cache: "no-store" });
      if (!response.ok) throw new Error("SIMU API unavailable");
      const data = await response.json();
      const state = data.state || {};
      const curves = (data.charts && data.charts.daily) || [];
      renderState(state);
      renderTelemetry(curves, state);
      document.getElementById("curve-stack").innerHTML = curves.map((curve) => renderCurve(curve, state)).join("");
      renderAlarms(data.alarms);
    }

    async function sendAction(action) {
      await fetch("/api/simu/control", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ action })
      });
      await loadBackendData();
    }

    for (const button of document.querySelectorAll("[data-action]")) {
      button.addEventListener("click", () => sendAction(button.dataset.action));
    }

    async function tick() {
      updateClock();
      await loadBackendData().catch(() => {});
    }

    tick();
    setInterval(tick, 2000);
  </script>
</body>
</html>
